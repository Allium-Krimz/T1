name: Build T1 Client (EXE + JAR)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Fabric mod JAR
        working-directory: fabric-mod
        shell: cmd
        run: gradlew.bat clean build

      - name: Publish launcher EXE
        shell: pwsh
        run: >
          dotnet publish fabric-mod/launcher/T1Launcher/T1Launcher.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o out-launcher

      - name: Collect release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item out-launcher\T1Launcher.exe release\
          Get-ChildItem fabric-mod\build\libs\t1client-*.jar |
            Where-Object { $_.Name -notmatch 'sources|dev|javadoc' } |
            Copy-Item -Destination release\
          Copy-Item -Recurse fabric-mod release\fabric-mod
          Remove-Item -Recurse -Force release\fabric-mod\.gradle, release\fabric-mod\build, release\fabric-mod\.github -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: T1Client-windows
          path: release
